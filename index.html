<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cricket Times is now The Grass Bank</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://thegrassbank.com/">
<!-- cricketimes.com moved to thegrassbank.com on 2026-10-09. Sends every
     request to the same path on the new domain, so old links, emails and
     bookmarks keep working. A page redirect, not a server 301, so turning it
     off (disable Pages on this repo) takes effect for everyone immediately. -->
<script>location.replace("https://thegrassbank.com" + location.pathname + location.search + location.hash);</script>
<noscript><meta http-equiv="refresh" content="0; url=https://thegrassbank.com/"></noscript>
</head>
<body>
<p>Cricket Times is now <a href="https://thegrassbank.com/">The Grass Bank</a>.</p>
</body>
</html>
