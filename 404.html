<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cricket Times is now The Grass Bank</title>
<meta name="robots" content="noindex">
<!-- Same as index.html. GitHub Pages serves this for every path that has no
     file here, which is every old cricketimes.com URL, so this is the page
     that does nearly all the redirecting. Keep the two files identical. -->
<script>location.replace("https://thegrassbank.com" + location.pathname + location.search + location.hash);</script>
<noscript><meta http-equiv="refresh" content="0; url=https://thegrassbank.com/"></noscript>
</head>
<body>
<p>Cricket Times is now <a href="https://thegrassbank.com/">The Grass Bank</a>.</p>
</body>
</html>
